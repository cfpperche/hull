name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege, stated rather than inherited from the repo default.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs: a tag is mutable, so `@v4` lets the
      # action's owner change what runs here after review. The trailing comment
      # is the tag the SHA came from.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @hull/www build
      - run: pnpm --filter @hull/web build
      - run: pnpm --filter @hull/admin build
      # Exercises the hardcoded workspace importer list in the frontend
      # Dockerfile, which nothing else in CI touches.
      - run: docker build -f deploy/docker/frontend.Dockerfile --build-arg SHELL=web -t hull-web:ci .
      - run: ./scripts/test.sh
