name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege, stated rather than inherited from the repo default.
permissions:
  contents: read

# The gate lives in scripts/ci.sh and scripts/ci-e2e.sh, not here. This file only
# provisions a runner and calls them, so `make ci` on a workstation runs the same
# code — and a step cannot be added to one without the other.

# A hung job costs six hours without this. Measured 2026-08-18: `test` runs in
# ~2 minutes and `e2e` in ~2m20s, and one `e2e` hung inside ci-e2e.sh until
# GitHub's own 360-minute ceiling killed it — which the API then reports as
# `cancelled`, so it does not even read as a timeout when you go looking. Twenty
# minutes is eight times the observed worst case: generous enough that a cold
# cache or a slow runner never trips it, tight enough that a hang is a nuisance
# rather than a day of runner time.

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to commit SHAs: a tag is mutable, so `@v4` lets the
      # action's owner change what runs here after review. The trailing comment
      # is the tag the SHA came from.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - run: ./scripts/ci.sh

  # Separate job on purpose: the checks above give feedback in ~90s and must not
  # wait on a compose stack. E2E covers the layer none of them can reach — what a
  # browser actually does. See docs/adr/0012-browser-e2e-with-playwright.md.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - run: ./scripts/ci-e2e.sh

      - if: failure()
        run: docker compose --env-file .env -f deploy/compose.yaml -p hull logs --tail 200
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
