openapi: 3.1.0
info:
  title: Hull host API
  version: 0.1.0
  description: |
    Cookie session. Isolation is org_id. This file is the contract.
    adapters/fastapi is the default implementation.

    Errors are always application/problem+json with the Problem schema below;
    `reason_code` is the stable, machine-readable member. Clients branch on it,
    not on the prose in `detail`.
servers:
  - url: /api

# Everything needs the session cookie unless an operation opts out with
# `security: []`. Without this the whole surface — including /v1/admin/* — is
# specified as unauthenticated, and a generated server stub ships with no guard.
security:
  - session: []

paths:
  /health:
    get:
      operationId: health
      security: []
      responses:
        "200":
          description: Process is up
  /v1/auth/signup:
    post:
      operationId: signup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username: { type: string, pattern: "^[a-z0-9_]{3,24}$" }
                email: { type: string }
                password: { type: string, minLength: 8 }
      responses:
        "201":
          description: User + session cookie. No org yet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Invalid"
  /v1/auth/signin:
    post:
      operationId: signin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Session cookie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /v1/auth/forgot:
    post:
      operationId: forgotPassword
      security: []
      description: >
        Mail a single-use reset link. Answers 204 whether or not the address has
        an account — a distinguishable response would make this a membership
        oracle for any address someone cares to try.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        "204":
          description: Accepted, whether or not a mail was sent
  /v1/auth/reset:
    post:
      operationId: resetPassword
      security: []
      description: >
        Redeem a reset token and set a new password. The token arrives in the
        link's fragment, so it never reaches a server log. Every session of that
        user ends; the caller signs in with the new password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string }
      responses:
        "204":
          description: Password set, every session ended
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/Invalid"
  /v1/auth/verify:
    post:
      operationId: verifyEmail
      security: []
      description: >
        Redeem an email confirmation link. Public on purpose: the link is opened
        from a mail client, often on another device, and it grants nothing that
        would need a session to protect. The token arrives in the link's
        fragment, so it never reaches a server log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "204":
          description: Address confirmed
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /v1/me/verify:
    post:
      operationId: resendVerification
      description: >
        Send the confirmation link again. Answers 204 whether or not a mail went
        out — an address that is already confirmed has no state to change.
      responses:
        "204":
          description: Accepted
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /v1/me/email:
    post:
      operationId: changeEmail
      description: >
        Ask to move the account to another address. Nothing changes yet: the
        current address keeps signing in and keeps receiving reset mail until the
        new one redeems its link. The password is confirmed here, because this is
        the step a stolen session would reach. The new address is mailed a link;
        the current one is mailed a notice, and changing the password cancels
        every pending change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, email]
              properties:
                password: { type: string }
                email: { type: string, format: email }
      responses:
        "204":
          description: Link mailed to the new address, notice to the current one
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Invalid"
  /v1/auth/email:
    post:
      operationId: confirmEmailChange
      security: []
      description: >
        Redeem an address-change link. Public for the same reason as
        /v1/auth/verify — it is opened from the new mailbox, which by definition
        has no session here yet. The address moves and is marked verified in one
        step; sessions survive, since this is a deliberate edit rather than a
        recovery. 409 if somebody claimed the address while the link waited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "204":
          description: Address moved and confirmed
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/me/sessions:
    get:
      operationId: listSessions
      description: >
        Every live session of this user, most recently used first. `current`
        marks the one making the request; `support` marks one taken to view a
        customer's workspace. Expired rows are not listed and not deleted —
        sweeping them is sign-in's job.
      responses:
        "200":
          description: The live sessions
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      type: object
                      required: [id, device, created_at, last_seen_at, support, current]
                      properties:
                        id: { type: string, format: uuid }
                        device:
                          type: string
                          description: >
                            A short reading of the User-Agent, e.g. "Chrome on
                            Windows", or "Unknown device". Not a promise about
                            the client — User-Agent is self-reported.
                        created_at: { type: string, format: date-time }
                        last_seen_at:
                          type: string
                          format: date-time
                          description: Stamped on use, at most once a minute.
                        support: { type: boolean }
                        current: { type: boolean }
        "401":
          $ref: "#/components/responses/Unauthenticated"
    delete:
      operationId: revokeOtherSessions
      description: >
        End every session of this user except the caller's own. No password:
        revoking only takes access away, and putting a credential in front of the
        safe action is backwards at the moment somebody stops trusting a device.
      responses:
        "204":
          description: The others ended; this one survives
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /v1/me/sessions/{id}:
    delete:
      operationId: revokeSession
      description: >
        End one session. 404 when it is not this user's — the id is not a secret,
        so ownership is enforced in the delete itself. Ending your own is allowed
        and clears the cookie: it is what "not this device" means.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Ended
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/auth/signout:
    post:
      operationId: signout
      security: []
      responses:
        "204":
          description: Cookie cleared
  /v1/me:
    get:
      operationId: me
      responses:
        "200":
          description: The current principal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
    patch:
      operationId: updateMe
      description: |
        Only the members present in the body are written. An omitted member is
        left alone; an empty `name` clears the stored display name.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string, pattern: "^[a-z0-9_]{3,24}$" }
                name: { type: string }
      responses:
        "200":
          description: The updated principal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Invalid"
    delete:
      operationId: closeAccount
      description: |
        Deletes the login and every org the user is the sole owner of. Orgs with
        other members survive. Irreversible.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "204":
          description: Login deleted, cookie cleared
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/me/password:
    post:
      operationId: changePassword
      description: |
        Every session dies, the caller's included, and the response carries a
        fresh session cookie so the caller stays signed in. A token captured
        before the change cannot be used after it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current, password]
              properties:
                current: { type: string }
                password: { type: string, minLength: 8 }
      responses:
        "204":
          description: Password changed, all sessions revoked, new cookie set
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/Invalid"
  /v1/me/avatar:
    get:
      operationId: getAvatar
      responses:
        "200":
          description: The stored photo
          content:
            image/webp:
              schema: { type: string, format: binary }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: uploadAvatar
      description: |
        jpeg, png or webp, 5 MB maximum. Content-Length is required and is
        checked before the body is read.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "411":
          $ref: "#/components/responses/Invalid"
        "413":
          $ref: "#/components/responses/Invalid"
        "422":
          $ref: "#/components/responses/Invalid"
        "503":
          description: Object store is not configured
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/orgs:
    post:
      operationId: createOrg
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        "201":
          description: Org created and made current
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/Invalid"
  /v1/session/org:
    post:
      operationId: switchOrg
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, format: uuid }
      responses:
        "200":
          description: Current org switched
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
  /v1/admin/users:
    get:
      operationId: adminUsers
      description: platform_admin only.
      responses:
        "200":
          description: Every user on the install
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/AdminUser" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/admin/orgs:
    get:
      operationId: adminOrgs
      description: platform_admin only.
      responses:
        "200":
          description: Every org on the install
          content:
            application/json:
              schema:
                type: object
                required: [orgs]
                properties:
                  orgs:
                    type: array
                    items: { $ref: "#/components/schemas/AdminOrg" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/admin/support:
    post:
      operationId: supportStart
      description: |
        platform_admin only. Mints a one-time hand-off token; it does not change
        the caller's session. The session cookie is host-scoped, so the admin
        console's session does not reach the customer surface — this token does,
        once, and the console passes it in a URL fragment so it never reaches a
        server log or a Referer header.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [org_id]
              properties:
                org_id: { type: string, format: uuid }
      responses:
        "200":
          description: A single-use hand-off token, valid for 60 seconds
          content:
            application/json:
              schema:
                type: object
                required: [handoff]
                properties:
                  handoff: { type: string }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
    delete:
      operationId: supportStop
      description: |
        Ends impersonation by deleting the session it lives on, and clears the
        cookie. The caller is expected to return to the admin console.
      responses:
        "204":
          description: Impersonating session ended, cookie cleared
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /v1/session/handoff:
    post:
      operationId: consumeHandoff
      security: []
      description: |
        Exchange a hand-off token for a session on this host. Unauthenticated by
        design: the browser arrives with no cookie for this host, which is the
        reason the hand-off exists. The token is single-use — redemption and
        consumption happen in one statement — and the platform_admin role is
        re-checked here, not only when the token was minted. The session it
        creates belongs to the admin, carries the acting org, and expires in 45
        minutes rather than the usual 14 days.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: Impersonating session created for this host
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Invalid"
components:
  responses:
    Unauthenticated:
      description: No session, or the session has expired
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Authenticated, but not allowed
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: No such object, or not visible to this principal
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: email_taken or username_taken
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Invalid:
      description: The request did not validate
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      description: RFC 7807. `status` always equals the HTTP status of the response.
      type: object
      required: [title, detail, status, reason_code]
      properties:
        type: { type: string }
        title: { type: string }
        detail: { type: string }
        status: { type: integer }
        reason_code:
          description: The stable member clients branch on.
          type: string
          enum:
            - unauthenticated
            - forbidden
            - not_found
            - email_taken
            - username_taken
            - request_validation_error
            - storage_not_configured
            - http_error
            - server_error
    Org:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    AdminOrg:
      type: object
      required: [id, name, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        created_at: { type: string, format: date-time }
    User:
      type: object
      required: [id, email, username, name, has_avatar, email_verified]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        # 3.1 union types. `nullable: true` is a 3.0 keyword and is ignored here,
        # which made this schema reject the nulls every signup response returns.
        username: { type: [string, "null"] }
        name: { type: [string, "null"] }
        has_avatar: { type: boolean }
        email_verified: { type: boolean }
    AdminUser:
      type: object
      required: [id, email, username, name, has_avatar, platform_role, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        username: { type: [string, "null"] }
        name: { type: [string, "null"] }
        has_avatar: { type: boolean }
        platform_role: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    Acting:
      type: object
      required: [org, expires_at]
      properties:
        org: { $ref: "#/components/schemas/Org" }
        expires_at: { type: string, format: date-time }
    Me:
      type: object
      required: [user, org, orgs, platform_role, acting]
      properties:
        user: { $ref: "#/components/schemas/User" }
        org:
          oneOf:
            - $ref: "#/components/schemas/Org"
            - type: "null"
        orgs:
          type: array
          items: { $ref: "#/components/schemas/Org" }
        platform_role: { type: [string, "null"] }
        acting:
          oneOf:
            - $ref: "#/components/schemas/Acting"
            - type: "null"
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      # Install-configurable via HULL_COOKIE_NAME (see AGENTS.md white-label
      # locks). This is the default, not a constant to hardcode in an adapter.
      name: hull_session
