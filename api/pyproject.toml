[project]
name = "hull-api"
version = "0.1.0"
description = "Hull host API: auth, orgs, profile, admin"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic-settings>=2.6,<3",
    "psycopg[binary]>=3.2,<4",
    "boto3>=1.35,<2",
    "pillow>=11,<13",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.27,<1",
    "ruff>=0.9,<1",
]

[project.scripts]
hull-api = "hull_api.cli:api_main"
hull-migrate = "hull_api.cli:migrate_main"
hull-seed = "hull_api.cli:seed_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hull_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
