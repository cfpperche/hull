# Single Hull block in Docker Desktop / VS Code Containers.
# Project name: hull — Traefik lives here; do not join a shared workstation proxy.
#
# The Containers panel groups by com.docker.compose.project (this `name:`).
# Do not `docker run` Hull processes: they land under Individual Containers.
name: hull

x-hull-labels: &hull_labels
  hull.project: hull

services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:16
    container_name: hull-pg
    restart: unless-stopped
    labels:
      <<: *hull_labels
      hull.role: postgres
    environment:
      POSTGRES_USER: ${HULL_POSTGRES_USER:-hull}
      POSTGRES_PASSWORD: ${HULL_POSTGRES_PASSWORD:-hull}
      POSTGRES_DB: ${HULL_POSTGRES_DB:-hull}
    ports:
      - "127.0.0.1:${HULL_PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${HULL_POSTGRES_USER:-hull} -d ${HULL_POSTGRES_DB:-hull}"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - hull_pg_data:/var/lib/postgresql/data
    networks: [hull]

  testdb:
    image: public.ecr.aws/docker/library/postgres:16
    container_name: hull-test-pg
    profiles: ["test"]
    restart: unless-stopped
    labels:
      <<: *hull_labels
      hull.role: test-postgres
    environment:
      POSTGRES_USER: hull
      POSTGRES_PASSWORD: hull
      POSTGRES_DB: hull_test
    ports:
      - "127.0.0.1:${HULL_TEST_PG_PORT:-55434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U hull -d hull_test"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - hull_test_pg_data:/var/lib/postgresql/data
    networks: [hull]

  rustfs:
    image: rustfs/rustfs:1.0.0-alpha.67
    container_name: hull-rustfs
    restart: unless-stopped
    command: ["/data"]
    labels:
      <<: *hull_labels
      hull.role: s3
    environment:
      RUSTFS_ACCESS_KEY: ${HULL_S3_ACCESS_KEY:-hull-s3}
      RUSTFS_SECRET_KEY: ${HULL_S3_SECRET_KEY:-hull-s3-lab-secret}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
    volumes:
      - hull_s3_data:/data
      # /logs is a VOLUME in the image. Unmounted, every container recreate
      # strands another anonymous volume — `up.sh` recreates on every build, so
      # they accumulate one per run and nothing ever reads them. tmpfs rather
      # than a named volume because they are logs of a lab S3 at level=error:
      # worth having while the container is up, worth nothing after it.
      - type: tmpfs
        target: /logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks: [hull]

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: hull-mailpit
    restart: unless-stopped
    labels:
      <<: *hull_labels
      hull.role: mail
    networks: [hull]

  migrate:
    image: public.ecr.aws/docker/library/postgres:16
    container_name: hull-migrate
    profiles: ["tools"]
    restart: "no"
    labels:
      <<: *hull_labels
      hull.role: migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${HULL_POSTGRES_USER:-hull}
      PGPASSWORD: ${HULL_POSTGRES_PASSWORD:-hull}
      PGDATABASE: ${HULL_POSTGRES_DB:-hull}
      HULL_SEED_DEMO: ${HULL_SEED_DEMO:-1}
      HULL_HOST: ${HULL_HOST:-hull.test}
    volumes:
      - ../schema:/schema:ro
      - ../scripts/migrate.sh:/migrate.sh:ro
    entrypoint: ["bash", "/migrate.sh"]
    networks: [hull]

  api:
    image: ${HULL_API_IMAGE:-hull-api:0.1.0}
    container_name: hull-api
    restart: unless-stopped
    labels:
      <<: *hull_labels
      hull.role: api
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    environment:
      HULL_DATABASE_URL: postgresql://${HULL_POSTGRES_USER:-hull}:${HULL_POSTGRES_PASSWORD:-hull}@postgres:5432/${HULL_POSTGRES_DB:-hull}
      HULL_HOST: ${HULL_HOST:-hull.test}
      HULL_BRAND: ${HULL_BRAND:-Hull}
      HULL_MARK: ${HULL_MARK:-}
      HULL_COOKIE_NAME: ${HULL_COOKIE_NAME:-hull_session}
      HULL_PUBLIC_ORIGIN: ${HULL_PUBLIC_ORIGIN:-}
      HULL_ROOT_PATH: /api
      HULL_SMTP_HOST: mailpit
      HULL_SMTP_PORT: "1025"
      HULL_MAIL_FROM: ${HULL_MAIL_FROM:-}
      HULL_S3_ENDPOINT: http://rustfs:9000
      HULL_S3_ACCESS_KEY: ${HULL_S3_ACCESS_KEY:-hull-s3}
      HULL_S3_SECRET_KEY: ${HULL_S3_SECRET_KEY:-hull-s3-lab-secret}
      HULL_S3_BUCKET_AVATARS: hull-avatars
    command: ["hull-fastapi"]
    networks: [hull]

  www:
    image: ${HULL_WWW_IMAGE:-hull-www:0.1.0}
    container_name: hull-www
    restart: unless-stopped
    labels:
      <<: *hull_labels
      hull.role: www
    volumes:
      - ./brand/config.json:/usr/share/nginx/html/config.json:ro
    networks: [hull]

  web:
    image: ${HULL_WEB_IMAGE:-hull-web:0.1.0}
    container_name: hull-web
    restart: unless-stopped
    labels:
      <<: *hull_labels
      hull.role: web
    volumes:
      - ./brand/config.json:/usr/share/nginx/html/config.json:ro
    networks: [hull]

  admin:
    image: ${HULL_ADMIN_IMAGE:-hull-admin:0.1.0}
    container_name: hull-admin
    restart: unless-stopped
    labels:
      <<: *hull_labels
      hull.role: admin
    volumes:
      - ./brand/config.json:/usr/share/nginx/html/config.json:ro
    networks: [hull]

  traefik:
    image: traefik:v3.3
    container_name: hull-traefik
    restart: unless-stopped
    labels:
      <<: *hull_labels
      hull.role: edge
    depends_on:
      - api
      - www
      - web
      - admin
    ports:
      - "${HULL_BIND:-127.0.0.1}:80:80"
      - "${HULL_BIND:-127.0.0.1}:443:443"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      # Leaf pair only. Mounting ./certs would also hand the container ca/ca.key,
      # the key to a CA installed in the host (and Windows) root stores.
      - ./certs/hull-cert.pem:/etc/traefik/certs/hull-cert.pem:ro
      - ./certs/hull-key.pem:/etc/traefik/certs/hull-key.pem:ro
    networks: [hull]

  dbgate:
    image: dbgate/dbgate:alpine
    container_name: hull-dbgate
    restart: unless-stopped
    labels:
      <<: *hull_labels
      hull.role: studio  # dbgate: a lab service like mailpit/rustfs, not opt-in
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # With LOGIN+PASSWORD set, dbgate's auth provider is "logins". Without them
      # it is "none" — an owner-level SQL console on the live database, reachable
      # from any page the developer happens to visit.
      LOGIN: ${HULL_DBGATE_USER:-hull}
      # Defaulted, not required: compose interpolates the whole file up front,
      # so a `:?` here would fail every command, not just the ones touching dbgate.
      PASSWORD: ${HULL_DBGATE_PASSWORD:-hull-studio-lab-secret}
      CONNECTIONS: hull
      LABEL_hull: Hull Postgres
      SERVER_hull: postgres
      USER_hull: ${HULL_POSTGRES_USER:-hull}
      PASSWORD_hull: ${HULL_POSTGRES_PASSWORD:-hull}
      PORT_hull: "5432"
      DATABASE_hull: ${HULL_POSTGRES_DB:-hull}
      ENGINE_hull: postgres@dbgate-plugin-postgres
    volumes:
      # Named, for the same reason as rustfs above: /root/.dbgate is a VOLUME in
      # the image, and unmounted it strands one anonymous volume per recreate.
      # Named rather than tmpfs because saved queries live here, and losing them
      # on every `up.sh` is its own small tax.
      - hull_dbgate_data:/root/.dbgate
    networks: [hull]

  dns:
    image: coredns/coredns:1.12.0
    container_name: hull-dns
    profiles: ["dns"]
    restart: unless-stopped
    labels:
      <<: *hull_labels
      hull.role: dns
    command: ["-conf", "/etc/coredns/Corefile"]
    ports:
      - "127.0.0.1:53:53/udp"
      - "127.0.0.1:53:53/tcp"
    volumes:
      - ./coredns/Corefile:/etc/coredns/Corefile:ro
    networks: [hull]

networks:
  hull:
    name: hull

volumes:
  hull_pg_data:
    name: hull_pg_data
  hull_s3_data:
    name: hull_s3_data
  hull_test_pg_data:
    name: hull_test_pg_data
  hull_dbgate_data:
    name: hull_dbgate_data
