[project]
name = "hull-fastapi"
version = "0.1.0"
description = "Hull FastAPI adapter: implements contracts/ against schema/"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic-settings>=2.6,<3",
    "psycopg[binary]>=3.2,<4",
    "boto3>=1.35,<2",
    "pillow>=11,<13",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.27,<1",
    "ruff>=0.9,<1",
]

[project.scripts]
hull-fastapi = "hull_fastapi.cli:api_main"
hull-api = "hull_fastapi.cli:api_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hull_fastapi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Explicit, not inherited. Ruff widens its default rule set between releases, so
# an implicit default would let a routine upgrade turn CI red on untouched code.
select = ["E", "F", "I", "B", "C4", "SIM", "UP"]
# `ruff format` owns line length. E501 only fires where the formatter cannot
# help — a long SQL line inside a triple-quoted string — so keeping it would buy
# scattered noqa comments and nothing else. CI runs `ruff format --check`.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# B008 flags a call in an argument default. That IS FastAPI's dependency
# injection — `sess=Depends(require_session)` is the documented idiom, not a
# mutable-default bug. Exempt the injectors rather than silencing the rule,
# which still catches a real `def f(x=[])`.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]
